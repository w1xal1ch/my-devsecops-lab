services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devsecops-net

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - devsecops-net

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - devsecops-net

  scanner-panel:
    build: ./scanner-panel
    container_name: scanner-panel
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./reports:/app/reports
    networks:
      - devsecops-net

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - devsecops-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - devsecops-net
  scripts:
    build: .
    container_name: my_scripts
    depends_on:
      - db
    networks:
      - lab-net
  webapp:
    build: ./webapp
    container_name: webapp
    ports:
      - "5000:5000"
    networks:
      - lab-net
    volumes:
      - ./scripts:/app/scripts
      - ./reports:/app/reports
  juiceshop:
    image: bkimminich/juice-shop
    container_name: juiceshop
    ports:
      - "3001:3000"
    networks:
      - lab-net

  db:
    image: postgres:16
    container_name: pgsql
    environment:
      POSTGRES_USER: pentest
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: results
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - lab-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
    ports:
      - "8081:80"
    networks:
      - lab-net

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    networks:
      - lab-net

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer

    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - devsecops-net

  site-access:
    build: ./sites/access
    container_name: site-access
    restart: unless-stopped
    ports:
      - "8001:80"
    depends_on:
      - mysql
    networks:
      - devsecops-net

  site-suvenir:
    build: ./sites/suvenir
    container_name: site-suvenir
    restart: unless-stopped
    ports:
      - "8002:80"
    depends_on:
      - mysql
    networks:
      - devsecops-net

networks:
  devsecops-net:
    driver: bridge

volumes:
  mysql_data:
  portainer_data:
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - lab-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3030:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge

volumes:
  db-data:
  gitea-data:
  portainer-data:
  grafana-data:
